# Electron apps (VS Code, Slack, Teams, Discord) default to XWayland, which means
# software scaling — blurry text and caret/scroll jank on fractionally-scaled or
# rotated outputs. `auto` selects the Wayland Ozone backend in a Wayland session.
# Only *Electron* reads this env var; plain Chromium / Google Chrome do NOT — see
# the per-app `.desktop` override for chrome. IME over Wayland still needs the
# per-app `--enable-wayland-ime` flag (there is no env form). See docs/vscode.md
# and docs/xdg-environment.md.
ELECTRON_OZONE_PLATFORM_HINT=auto
