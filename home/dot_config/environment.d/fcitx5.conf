# Input-method transports for fcitx5. Two paths reach fcitx: the legacy IM-module
# env vars (X11 / XWayland apps) and the Wayland `text-input` protocol (native
# Wayland apps, spoken by niri). Keep them from overlapping:
#
# - GTK_IM_MODULE is intentionally NOT set. niri speaks text-input-v3 and fcitx5's
#   Wayland frontend is running, so GTK3/GTK4 Wayland apps use their built-in
#   `wayland` im module automatically. Setting GTK_IM_MODULE=fcitx on top of that
#   makes GTK apps route input through *both* paths, which fcitx flags as its
#   "Wayland Diagnose" warning ("unset GTK_IM_MODULE"). Electron apps get IME via
#   --enable-wayland-ime instead (electron.conf + per-app flags), not this var.
# - QT_IM_MODULE stays: Qt5 apps still default to XWayland and need it.
# - XMODIFIERS stays: the XIM path for all X11 / XWayland apps.
#
# See docs/fcitx5.md.
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
