# Per-user launch flags for the `code` / `visual-studio-code-bin` package, read by
# its patched loader script (Arch: ~/.config/code-flags.conf). One flag per line,
# read only at session start (a full logout/login, not `chezmoi apply` alone).
#
# Nothing is active here on purpose:
# - Ozone/Wayland is handled centrally by ELECTRON_OZONE_PLATFORM_HINT=auto in
#   environment.d/electron.conf (flips every Electron app to native Wayland at once).
# - IME needs no flag on this stack. Verified on VS Code 1.131 / Electron 42.7:
#   fcitx5 reaches VS Code over the Wayland text-input protocol on its own — a
#   `program:code frontend:wayland_v2` context shows in `fcitx5-diagnose` and
#   Vietnamese composes in the editor with NO --enable-wayland-ime. Newer Electron
#   enables Wayland IME by default; passing the flag now only earns VS Code's
#   harmless "not in the list of known options, but still passed" warning.
#
# Fallbacks (uncomment only if the symptom appears):
#   --enable-wayland-ime        # older Electron with no default Wayland IME —
#                               # Slack/Teams/Discord still need it (see their
#                               # .desktop overrides); VS Code 1.131 does not.
#   --ozone-platform-hint=auto  # if VS Code comes up on XWayland (env not applied).
