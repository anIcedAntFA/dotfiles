# Turn off the login-time xdg-user-dirs-update. It resets every entry in
# user-dirs.dirs whose folder is missing to "$HOME/", which fights the tracked
# file on any machine without ~/Desktop, ~/Music, … — and would leave it
# disagreeing with environment.d/xdg.conf. The repo owns user-dirs.dirs instead.
enabled=False
filename_encoding=UTF-8
