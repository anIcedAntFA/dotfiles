[preferred]
default=gnome
# Screencast/screenshot were routed to wlr, but niri isn't wlroots-based and the
# wlr backend (xdg-desktop-portal-wlr) was removed in the Noctalia v4->v5 move
# (see docs/adr/0017). niri's screencast goes through xdg-desktop-portal-gnome.
org.freedesktop.impl.portal.Screenshot=gnome
org.freedesktop.impl.portal.ScreenCast=gnome
# Settings stays on gtk: it reads the org.gnome.desktop.interface color-scheme
# gsetting (written by darkman) and broadcasts org.freedesktop.appearance to
# portal-aware apps (Ghostty, Chrome, Waterfox, Discord, Teams, VS Code). gnome also
# implements Settings, but we pin gtk to keep the darkman->gtk->apps path in
# docs/theme-sync.md unchanged. Do NOT drop this line.
org.freedesktop.impl.portal.Settings=gtk
