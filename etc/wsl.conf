# /etc/wsl.conf — per-distro WSL settings, read when the distro boots.
# WSL guest only (docs/windows.md). Apply inside the distro, then restart it
# from Windows with `wsl --shutdown`:
#
#   sudo cp etc/wsl.conf /etc/wsl.conf
#
# https://learn.microsoft.com/en-us/windows/wsl/wsl-config#wslconf

[boot]
# systemd as PID 1 — docker.service and user units need it. The official Arch
# image already boots this way; stated here so a rebuilt distro matches.
systemd = true

[interop]
# Keep Windows' Path appended (the default). It is what puts `code`, `explorer.exe`
# and `clip.exe` on PATH inside the guest. Linux directories come first, so a
# Windows tool only wins when the guest has no tool of that name — keep mise,
# git and node installed in the guest and they never get shadowed.
appendWindowsPath = true
